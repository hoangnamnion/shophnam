<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Locket Gold Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(255,206,70,.18),transparent 35%),radial-gradient(circle at 100% 100%,rgba(255,153,0,.12),transparent 35%),#0b0c10;color:#fff;padding:28px 16px}
.wrap{max-width:860px;margin:auto}
h1{font-size:30px;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#9ca3af;margin-bottom:22px;font-size:14px}
.card{background:rgba(20,22,28,.9);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:16px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;background:#101217;color:#fff;border:1px solid #2c3039;border-radius:12px;padding:13px 14px;outline:none;font-size:15px}
input:focus{border-color:#ffbf32;box-shadow:0 0 0 3px rgba(255,191,50,.09)}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ffd657,#ff9f1a);color:#111;font-size:15px}
button:disabled{opacity:.5;cursor:not-allowed}
.profile{display:none;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#11141a;border:1px solid #262a34;margin-top:14px}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#252933;border:2px solid rgba(255,255,255,.12)}
.profile h2{font-size:18px;margin-bottom:4px}
.meta{font-size:12px;color:#a5adba;line-height:1.8;word-break:break-all}
.upgrade-wrap{display:none;margin-top:12px}
.upgrade-wrap button{width:100%;font-size:16px;padding:15px}
.status{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);color:#a7efbc}
.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.22);color:#ffb0b0}
.loading{display:block;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.22);color:#bed7ff}
.hist-list{display:grid;gap:10px;margin-top:4px}
.hist-item{display:flex;align-items:center;gap:12px;padding:12px;background:#11141a;border:1px solid #252a34;border-radius:13px}
.hist-item img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#252933}
.hist-main{flex:1;min-width:0}
.hist-main b{display:block;margin-bottom:2px}
.hist-main span{display:block;color:#9299a6;font-size:12px;word-break:break-all}
.empty{color:#7e8796;text-align:center;padding:20px;font-size:14px}
.sec-title{font-weight:800;font-size:16px;margin-bottom:14px}
.row-head{display:flex;align-items:center;margin-bottom:14px}
.row-head .sec-title{margin:0;flex:1}
.row-head button{background:#1e2330;color:#fff;font-size:13px;padding:8px 14px}
@media(max-width:600px){.row{flex-direction:column}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⭐ Locket Gold Manager</h1>
  <p class="sub">Tra cứu tài khoản và nâng cấp Gold nhanh chóng</p>

  <div class="card">
    <div class="sec-title">Tra cứu tài khoản</div>
    <div class="row">
      <input id="uname" placeholder="Nhập username Locket..." autocomplete="off">
      <button id="lookupBtn">Tra cứu</button>
    </div>
    <div class="profile" id="profile">
      <img class="avatar" id="avatar" alt="">
      <div>
        <h2 id="pname">-</h2>
        <div class="meta">
          @<span id="puname">-</span><br>
          UID: <span id="puid">-</span>
        </div>
      </div>
    </div>
    <div class="upgrade-wrap" id="upgradeWrap">
      <button id="upgradeBtn">⭐ Nâng Cấp Gold Ngay</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="row-head">
      <div class="sec-title">Lịch sử nâng cấp</div>
      <button id="refreshBtn">🔄 Làm mới</button>
    </div>
    <div class="hist-list" id="history"><div class="empty">Chưa có lịch sử.</div></div>
  </div>
</div>

<script>
const API = 'https://locketgold.caovannamutt.workers.dev/';
const $ = id => document.getElementById(id);

const uname = $('uname'), lookupBtn = $('lookupBtn'), upgradeBtn = $('upgradeBtn');
const profile = $('profile'), upgradeWrap = $('upgradeWrap'), statusBox = $('status');
let user = null;

upgradeBtn.disabled = true;

function setStatus(type, text) {
  statusBox.className = 'status ' + type;
  statusBox.textContent = text;
}

function esc(v) {
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtTime(v) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString('vi-VN');
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('gold_history') || '[]'); } catch { return []; }
}

function saveHistory(item) {
  const list = getHistory();
  list.unshift(item);
  localStorage.setItem('gold_history', JSON.stringify(list.slice(0, 999)));
  renderHistory(list);
}

function renderHistory(items = getHistory()) {
  const box = $('history');
  if (!items.length) { box.innerHTML = '<div class="empty">Chưa có lịch sử.</div>'; return; }
  box.innerHTML = items.map(i => `
    <div class="hist-item">
      <img src="${esc(i.avatar||'')}" alt="">
      <div class="hist-main">
        <b>${esc(i.name||i.username||'?')}</b>
        <span>@${esc(i.username||'-')}</span>
        <span>UID: ${esc(i.uid||'-')}</span>
        <span>${esc(fmtTime(i.time))}</span>
      </div>
    </div>`).join('');
}

async function lookup() {
  const username = uname.value.trim().toLowerCase();
  if (!username) { setStatus('err', 'Vui lòng nhập username.'); return; }

  lookupBtn.disabled = true;
  profile.style.display = 'none';
  upgradeWrap.style.display = 'none';
  upgradeBtn.disabled = true;
  user = null;
  setStatus('loading', '🔍 Đang tra cứu...');

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'info', username })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || data.message || 'Không tìm thấy tài khoản.');

    user = data;
    $('avatar').src = data.avatar || '';
    $('pname').textContent = data.name || username;
    $('puname').textContent = data.username || username;
    $('puid').textContent = data.uid || '-';

    profile.style.display = 'flex';
    upgradeWrap.style.display = 'block';
    upgradeBtn.disabled = false;
    upgradeBtn.textContent = '⭐ Nâng Cấp Gold Ngay';
    setStatus('ok', '✅ Tìm thấy tài khoản. Nhấn "Nâng Cấp Gold" để tiến hành.');
  } catch (e) {
    setStatus('err', '❌ ' + e.message);
  } finally {
    lookupBtn.disabled = false;
  }
}

async function upgrade() {
  if (!user) { setStatus('err', 'Tra cứu tài khoản trước.'); return; }

  upgradeBtn.disabled = true;
  upgradeBtn.textContent = '⏳ Đang xử lý...';
  setStatus('loading', `⏳ Đang nâng cấp Gold cho @${user.username}...`);

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'kick', username: user.username })
    });
    const data = await res.json().catch(() => ({ success: res.ok }));
    const ok = data.success === true || res.ok;

    const info = [
      ok ? '✅ Nâng cấp Gold thành công!' : '❌ Nâng cấp thất bại',
      `👤 ${user.name || '-'} (@${user.username})`,
      `🆔 UID: ${user.uid || '-'}`,
      data.status ? `📊 Status: ${data.status}` : '',
      data.error  ? `⚠️ ${data.error}` : '',
      data.message? `💬 ${data.message}` : ''
    ].filter(Boolean).join('\n');

    setStatus(ok ? 'ok' : 'err', info);

    if (ok) {
      upgradeBtn.textContent = '✅ Đã Nâng Gold!';
      saveHistory({ ...user, time: new Date().toISOString() });
    } else {
      upgradeBtn.disabled = false;
      upgradeBtn.textContent = '⭐ Thử Lại';
    }
  } catch (e) {
    setStatus('err', '❌ Lỗi: ' + e.message);
    upgradeBtn.disabled = false;
    upgradeBtn.textContent = '⭐ Nâng Cấp Gold Ngay';
  }
}

lookupBtn.addEventListener('click', lookup);
upgradeBtn.addEventListener('click', upgrade);
$('refreshBtn').addEventListener('click', () => renderHistory());
uname.addEventListener('keydown', e => e.key === 'Enter' && lookup());

renderHistory();
</script>
</body>
</html>
